name: Daily Report

on:
  schedule:
    - cron: '0 22 * * *'  # UTC 22:00 = JST 07:00
  workflow_dispatch:       # 手動テスト用

permissions: {}            # デフォルト無権限（最小権限の原則）

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # docs/index.html をコミット・プッシュするために必要

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily report
        run: python main.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}

      - name: Commit and push HTML report
        # LINE通知の失敗に関わらずプッシュを実行する。
        # python main.py が exit(1) するのは HTML 保存失敗時のみなので、
        # 保存成功 → LINE失敗 のケースでは exit(0) となりこのステップが実行される。
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "Update daily report $(date -u +%Y-%m-%d)"
          git push
